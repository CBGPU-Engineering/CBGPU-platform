services:
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    cpus: 2
    mem_limit: 3g
    networks: [demo]
  gateway:
    image: nginx:1.28-alpine
    depends_on: [demo]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./demo/nginx.conf:/etc/nginx/nginx.conf:ro
    cpus: 0.5
    mem_limit: 128m
    networks: [demo, ingress]
networks:
  demo:
    internal: true
  ingress: {}
