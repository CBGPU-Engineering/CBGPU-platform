name: Source release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate tag and source
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-publication.mjs
      - run: npm ci --no-audit --no-fund && npm test && npm run build:demo
        working-directory: FrontEnd/cbgpu
      - name: Package source and dependency inventory
        run: |
          mkdir -p release-artifacts
          git archive --format=tar.gz --prefix="CBGPU-$GITHUB_REF_NAME/" HEAD > "release-artifacts/CBGPU-$GITHUB_REF_NAME.tar.gz"
          (cd FrontEnd/cbgpu && npm sbom --sbom-format cyclonedx --omit=dev) > release-artifacts/web-sbom.cdx.json
          cp THIRD_PARTY_NOTICES.md release-artifacts/
          node scripts/checksums.mjs release-artifacts
      - name: Publish verified source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "CBGPU $GITHUB_REF_NAME" --latest --notes-file docs/releases/source-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
