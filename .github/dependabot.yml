version: 2
updates:
  - package-ecosystem: npm
    directories: [/FrontEnd/cbgpu, /backend/developer]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /FrontEnd/cbgpu_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directories: [/Daemon, /MaterialShare, /backend/latex]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
